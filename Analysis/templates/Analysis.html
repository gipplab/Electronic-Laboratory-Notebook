{% extends 'base.html' %}
{% load static %}
{% block content %}
    <form method="post" target="_blank"> 
        {% csrf_token %}
        <button type="submit" name="run_script" class="btn btn-primary">
            <i class="fa fa-rocket"></i> Open Jupyter
        </button>
    </form>
{% endblock content %}

{% block extrascripts %}
  <script type="text/javascript">
    $(function () {
      $(".create-book").each(function () { $(this).modalForm({formURL: $(this).data('id')}); });
      $(".update-book").each(function () { $(this).modalForm({formURL: $(this).data('id')}); });
      $(".read-book").each(function () { $(this).modalForm({formURL: $(this).data('id')}); });
      $(".delete-book").each(function () { $(this).modalForm({formURL: $(this).data('id')}); })
    });
  </script>
{% endblock extrascripts %}
